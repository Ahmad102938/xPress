name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Flags stay off in CI (the default). No remote credentials are used anywhere in this file.
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `turbo --affected` can compare a PR with its base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Pull requests check only the workspaces a change affects (plus their dependents);
      # pushes to main check everything.
      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      # Home must stay statically prerendered with sign-in present (docs/specs/auth.md R2-M17).
      # Runs whenever this run built the web app (always on main; on PRs when web is affected).
      - name: Home is prerendered
        run: if [ -d apps/web/.next ]; then pnpm --filter @acurexpress/web test:prerender; fi

  e2e:
    name: E2E (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [web, partner, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @acurexpress/${{ matrix.app }} exec playwright install --with-deps chromium

      # Builds the app, starts it and runs Playwright + axe against the production build.
      - name: Playwright
        run: pnpm turbo run test:e2e --filter=@acurexpress/${{ matrix.app }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report
          retention-days: 7

  # Database and auth jobs run against a throwaway LOCAL Supabase stack inside the runner
  # (docs/specs/auth.md R1-B9, R2-M21, R2-N4). No remote credentials. One database for all three
  # apps, so these jobs are not filtered by app. `pnpm db:start` creates the local signing key first.
  database:
    name: Database (local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - run: pnpm supabase db lint
      - name: Types are up to date
        run: pnpm db:types && git diff --exit-code packages/db/src/database.types.ts

  e2e-auth:
    name: E2E auth (web, local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:reset
      - name: Write the local auth e2e env (git-ignored)
        run: apps/web/scripts/auth-e2e-env.sh
      - name: Install Playwright Chromium
        run: pnpm --filter @acurexpress/web exec playwright install --with-deps chromium
      - name: Playwright (auth)
        run: pnpm --filter @acurexpress/web test:e2e:auth
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-auth
          path: apps/web/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # TODO(deploy): order is fixed. See docs/DEPLOYMENT.md.
  #   1. After merge to main: migrate STAGING first (`supabase db push` with the staging project
  #      ref and secrets from a GitHub environment), then let Vercel deploy the apps to staging.
  #   2. Production: manual approval by the project lead, migrate PRODUCTION, then promote the
  #      app deployments. Migrations must be backward compatible with the apps still running.
  #   Do not add credentials to this file.
  # ---------------------------------------------------------------------------
